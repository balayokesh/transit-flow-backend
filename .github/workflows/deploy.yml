name: Deploy to Render

on:
  push:
    branches: [main] # change if your branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Create a GitHub Deployment (marks it as "in progress")
      - name: Create GitHub Deployment
        id: create_deployment
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d '{
              "ref": "${{ github.sha }}",
              "environment": "production",
              "auto_merge": false,
              "required_contexts": []
            }')
          echo "deployment_id=$(echo $RESPONSE | jq -r '.id')" >> $GITHUB_OUTPUT

      # 2. Set status to "in_progress"
      - name: Set Deployment In Progress
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{
              "state": "in_progress",
              "description": "Deploying to Render...",
              "environment": "production"
            }'

      # 3. Trigger Render deploy via the hook URL
      - name: Trigger Render Deploy
        id: render_deploy
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Response: $RESPONSE"
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id // empty')
          echo "render_deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      # 4. Poll Render API until deploy is done
      - name: Wait for Render Deploy to Complete
        id: wait_for_render
        run: |
          echo "Polling Render for deploy status..."
          for i in $(seq 1 20); do
            sleep 30  # check every 30s, up to 10 mins total
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
              | jq -r '.[0].deploy.status')
            echo "Attempt $i: status = $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "result=success" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ]; then
              echo "result=failure" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
          echo "result=failure" >> $GITHUB_OUTPUT
          exit 1  # timed out

      # 5a. Mark GitHub deployment as SUCCESS
      - name: Set Deployment Success
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{
              "state": "success",
              "description": "Deployed successfully to Render!",
              "environment": "production",
              "environment_url": "https://transit-flow-k719.onrender.com"
            }'

      # 5b. Mark GitHub deployment as FAILURE
      - name: Set Deployment Failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d '{
              "state": "failure",
              "description": "Render deployment failed.",
              "environment": "production"
            }'
